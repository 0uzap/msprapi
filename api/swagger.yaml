definitions:
  Continent:
    type: "object"
    properties:
      idContinent:
        type: "integer"
        description: "ID du continent (clé primaire)"
      continent:
        type: "string"
        description: "Nom du continent"
    required:
      - idContinent
      - continent

  Pays:
    type: "object"
    properties:
      id_pays:
        type: "integer"
        description: "ID du pays (clé primaire)"
      pays:
        type: "string"
        description: "Nom du pays"
      idContinent:
        type: "integer"
        description: "ID du continent associé"
      continent:
        type: "string"
        description: "Nom du continent (jointure, lecture seule)"
    required:
      - id_pays
      - pays
      - idContinent

  PaysInput: # Schéma pour les requêtes POST/PUT sans l'ID généré automatiquement
    type: "object"
    properties:
      id_pays:
        type: "integer"
        description: "ID du pays (clé primaire)"
      pays:
        type: "string"
        description: "Nom du pays"
      idContinent:
        type: "integer"
        description: "ID du continent associé"
    required:
      - id_pays
      - pays
      - idContinent

  CovidCountry:
    type: "object"
    properties:
      id:
