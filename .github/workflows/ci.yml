name: CI

on:
  push:
    branches: [ main, ci-test ]
  pull_request:
    branches: [ main, ci-test ]

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      # Vars que ton app/jest lisent (équivalent .env.test)
      DB_HOST: 127.0.0.1
      DB_PORT: "3310"
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: bdd_mspr_api
      NODE_ENV: test
      PAYS_CIBLE: US
      JWT_SECRET: testsecret

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: bdd_mspr_api
        ports:
          - 3310:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -prootpassword"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install MySQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y mysql-client

      - name: Wait for MySQL
        run: |
          for i in {1..60}; do
            if mysql -h127.0.0.1 -P3310 -uroot -prootpassword -e "SELECT VERSION()"; then
              echo "MySQL is up"
              break
            fi
            echo "Waiting for MySQL..."
            sleep 2
          done

      - name: Show repo layout
        run: |
          pwd
          ls -la
          ls -la api
          ls -la api/sql

      - name: Inject minimal schema (create_tables.sql)
        run: |
          echo "🚀 Import du schéma minimal..."
          mysql -h127.0.0.1 -P3310 -uroot -prootpassword -D bdd_mspr_api < ./api/sql/create_tables.sql
          echo "✅ Schéma importé"

      - name: Sanity check tables
        run: |
          echo "🔎 Tables présentes :"
          mysql -h127.0.0.1 -P3310 -uroot -prootpassword -D bdd_mspr_api -e "SHOW TABLES;"
          echo "🔎 Colonnes 'users' :"
          mysql -h127.0.0.1 -P3310 -uroot -prootpassword -D bdd_mspr_api -e "SHOW COLUMNS FROM users;"

      - name: Install deps
        working-directory: ./api
        run: npm ci

      - name: Run tests
        working-directory: ./api
        run: npm test

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: api/coverage
