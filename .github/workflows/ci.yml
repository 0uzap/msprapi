name: CI

on:
  push:
    branches:
      - ci-test
  pull_request:
    branches:
      - ci-test

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        working-directory: ./api
        run: npm install

      - name: Run tests
        working-directory: ./api
        run: npm test

      - name: Build docker image
        working-directory: ./api
        run: docker build -t mspr-api .
